<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrocade DNA</title>
    <style>
        /* Center the content perfectly on the screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            /* Matches the white background of your non-transparent PNG */
            background-color: #ffffff; 
        }

        /* Ensure the image remains crisp, centered, and responsive */
        img {
            max-width: 90%;
            max-height: 90%;
            display: block;
        }
    </style>
</head>
<body>

    <img src="images/dna.png" alt="Astrocade DNA">

<script>
        // Listen for mouse clicks or monitor taps anywhere on the document
        document.addEventListener('click', function (event) {
            // event.detail automatically tracks consecutive rapid clicks (3 = triple click)
            if (event.detail === 3) {
                window.location.href = 'wizards-run.html';
            }
        });
    </script>
</body>
</html>
