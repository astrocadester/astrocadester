<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrocade DNA</title>
    <style>
        /* Center the content perfectly on the screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            /* Matches the white background of your non-transparent PNG */
            background-color: #ffffff; 
        }

        /* Ensure the image remains crisp, centered, and responsive */
        img {
            max-width: 90%;
            max-height: 90%;
            display: block;
        }
    </style>
</head>
<body>

    <img src="images/dna.png" alt="Astrocade DNA">

</body>
</html>
